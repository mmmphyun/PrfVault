<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrfVault</title>
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      width: 360px;
      margin: 0;
      padding: 16px;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      box-sizing: border-box;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 12px 0;
      color: #38bdf8;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .status-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }
    button:hover:not(:disabled) {
      background: #0369a1;
    }
  </style>
</head>
<body>
  <h1>
    <span>PrfVault</span>
    <span id="vault-badge" style="font-size: 12px; color: #94a3b8;">Locked</span>
  </h1>
  <div class="status-card" id="status-box">
    시스템 준비 중...
  </div>
  <button id="btn-action" disabled>잠금 해제</button>
  <script type="module" src="./popup.ts"></script>
</body>
</html>
