<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="auto">
  <defs>
    <style>
      text {
        text-rendering: geometricPrecision;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .font-sans {
        font-family: "Malgun Gothic", "맑은 고딕", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
      }
      .font-mono {
        font-family: Consolas, "Courier New", ui-monospace, SFMono-Regular, "SF Mono", monospace;
      }
      .node-title { font-size: 13px; font-weight: 700; fill: #e6edf3; }
      .node-sub { font-size: 11px; font-weight: 500; fill: #8b949e; }
      .edge-text { font-size: 11px; font-weight: 600; fill: #8b949e; }
      .badge-text { font-size: 10px; font-weight: 700; }
    </style>

    <marker id="arrow-gray-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8b949e"/>
    </marker>
    <marker id="arrow-green-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3fb950"/>
    </marker>
    <marker id="arrow-red-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f85149"/>
    </marker>
    <marker id="arrow-amber-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d29922"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="260" fill="#0d1117"/>

  <!-- ============================================================ -->
  <!-- COLUMN 1: TRIGGER (x: 30 ~ 160)                              -->
  <!-- ============================================================ -->
  <g transform="translate(30, 105)">
    <rect width="130" height="50" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.3"/>
    <text x="14" y="24" class="font-sans node-title">볼트 잠금 해제</text>
    <text x="14" y="40" class="font-sans node-sub">사용자 제스처 트리거</text>
  </g>


  <!-- ============================================================ -->
  <!-- COLUMN 2: INTERFACES (x: 235 ~ 435)                          -->
  <!-- ============================================================ -->

  <!-- Node A1: W3C PRF Request -->
  <g transform="translate(235, 45)">
    <rect width="200" height="48" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1.2"/>
    <text x="14" y="22" class="font-mono node-title" font-size="12">navigator.credentials</text>
    <text x="14" y="38" class="font-sans node-sub">W3C Level 3 PRF 요청</text>
  </g>

  <!-- Node B1: Native Host IPC -->
  <g transform="translate(235, 165)">
    <rect width="200" height="48" rx="6" fill="#21262d" stroke="#23553e" stroke-width="1.2"/>
    <text x="14" y="22" class="font-mono node-title" font-size="12">native-host.exe</text>
    <text x="14" y="38" class="font-sans node-sub">Chrome Native Messaging</text>
  </g>


  <!-- ============================================================ -->
  <!-- COLUMN 3: PLATFORM & HARDWARE (x: 490 ~ 690)                 -->
  <!-- ============================================================ -->

  <!-- Node A2: webauthn.dll Blocked -->
  <g transform="translate(490, 45)">
    <rect width="200" height="48" rx="6" fill="#2b1418" stroke="#f85149" stroke-width="1.2"/>
    <rect x="120" y="7" width="72" height="17" rx="3" fill="#4c1c24"/>
    <text x="156" y="19" class="font-mono badge-text" fill="#ff7b72" text-anchor="middle">{"prf":false}</text>
    <text x="14" y="22" class="font-mono node-title" font-size="12" fill="#ff7b72">webauthn.dll</text>
    <text x="14" y="38" class="font-sans node-sub" fill="#ffa198">플랫폼 인증자 PRF 거부</text>
  </g>

  <!-- Node B2: TPM 2.0 via ncrypt.dll -->
  <g transform="translate(490, 165)">
    <rect width="200" height="48" rx="6" fill="#0d281e" stroke="#3fb950" stroke-width="1.3"/>
    <rect x="122" y="7" width="70" height="17" rx="3" fill="#1b4731"/>
    <text x="157" y="19" class="font-mono badge-text" fill="#7ee787" text-anchor="middle">HARDWARE</text>
    <text x="14" y="22" class="font-sans node-title" font-size="12">ncrypt.dll FFI</text>
    <text x="14" y="38" class="font-sans node-sub">TPM 2.0 대칭키 직접 파생</text>
  </g>


  <!-- ============================================================ -->
  <!-- COLUMN 4: CORE CONVERGENCE (x: 755 ~ 945, width: 190)        -->
  <!-- ============================================================ -->

  <!-- Node C1: Rust Wasm Core & Zeroize -->
  <g transform="translate(755, 100)">
    <rect width="190" height="60" rx="6" fill="#0d281e" stroke="#3fb950" stroke-width="1.4"/>
    <rect x="122" y="7" width="60" height="17" rx="3" fill="#1b4731"/>
    <text x="152" y="19" class="font-mono badge-text" fill="#7ee787" text-anchor="middle">ZEROIZE</text>
    <text x="14" y="23" class="font-sans node-title" font-size="12" fill="#7ee787">Rust Wasm</text>
    <text x="14" y="40" class="font-sans node-sub" fill="#56d364">AES-256-GCM 복호화</text>
    <text x="14" y="52" class="font-mono node-sub" fill="#7ee787" font-size="10" font-weight="600">0x00 메모리 물리 소거</text>
  </g>


  <!-- ============================================================ -->
  <!-- CONNECTORS (INSPECTED & POLISHED)                            -->
  <!-- ============================================================ -->

  <!-- 1. Start -> A1 (1차 표준 시도) -->
  <path d="M 160,120 H 195 V 69 H 235" fill="none" stroke="#8b949e" stroke-width="1.3" marker-end="url(#arrow-gray-dark)"/>
  <rect x="168" y="56" width="54" height="18" rx="3" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
  <text x="195" y="69" class="font-sans edge-text" text-anchor="middle">1차 시도</text>

  <!-- 2. Start -> B1 (2차 직접 폴백) -->
  <path d="M 160,140 H 195 V 189 H 235" fill="none" stroke="#8b949e" stroke-width="1.3" marker-end="url(#arrow-gray-dark)"/>
  <rect x="168" y="196" width="54" height="18" rx="3" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
  <text x="195" y="209" class="font-sans edge-text" text-anchor="middle">미지원 시</text>

  <!-- 3. A1 -> A2 (표준 요청 직진) -->
  <path d="M 435,69 H 490" fill="none" stroke="#f85149" stroke-width="1.3" marker-end="url(#arrow-red-dark)"/>

  <!-- 4. A2 -> B2 (거부 감지 시 수직 폴백 직하강) -->
  <path d="M 590,93 V 165" fill="none" stroke="#d29922" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-amber-dark)"/>
  <rect x="530" y="119" width="120" height="19" rx="3" fill="#282110" stroke="#9e6a03" stroke-width="0.8"/>
  <text x="590" y="133" class="font-sans edge-text" fill="#f0883e" text-anchor="middle">거부 감지 시 폴백</text>

  <!-- 5. B1 -> B2 (Native Host -> TPM 키 도출 직진) -->
  <path d="M 435,189 H 490" fill="none" stroke="#3fb950" stroke-width="1.4" marker-end="url(#arrow-green-dark)"/>

  <!-- 6. B2 -> C1 (32B 대칭키 전달) -->
  <path d="M 690,189 H 722 V 130 H 755" fill="none" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrow-green-dark)"/>
  <rect x="695" y="150" width="54" height="18" rx="3" fill="#0d281e" stroke="#3fb950" stroke-width="0.8"/>
  <text x="722" y="163" class="font-mono edge-text" fill="#7ee787" text-anchor="middle">32B 키</text>

</svg>
